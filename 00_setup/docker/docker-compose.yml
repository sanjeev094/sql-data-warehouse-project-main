
# SQL Server 2022 for the Data Warehouse project
services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sql-dwh-project
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD before starting}"
    ports:
      - "1433:1433"
    volumes:
      - sql-dwh-project-data:/var/opt/mssql
    restart: unless-stopped

volumes:
  sql-dwh-project-data:
